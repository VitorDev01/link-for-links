<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vitordev01 | Links</title>

  <!-- Fonte + Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background: #020b0a;
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      padding: 0;
      color: #00ff88;
      text-align: center;

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 400px;
    }

    /* FOTO PERFIL */
    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;

      border: 2px solid #00ff00;

      box-shadow:
        0 0 10px #00ff00,
        0 0 20px #00ff00;
    }

    
    /* TÍTULO */
    .title {
      margin-bottom: 30px;
      font-size: 20px;
      text-shadow: 0 0 10px #00ff00;
    }

    /* LINKS */
    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* BOTÃO MATRIX */
    .matrix-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      height: 50px;

      color: #00ff88;
      text-decoration: none;
      border-radius: 6px;

      border: 2px solid #00ff00;

      background: linear-gradient(
        90deg,
        rgba(0,255,100,0.2),
        rgba(0,255,100,0.05)
      );

      box-shadow:
        0 0 5px #00ff66,
        inset 0 0 5px #00ff00;

      transition: 0.3s;
    }

    .matrix-btn:hover {
      background: #00ff66;
      color: #001a0f;

      box-shadow:
        0 0 10px #00ff66,
        0 0 25px #00ff66,
        0 0 50px #00ff00;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- FOTO -->
    <img src="foto.jpg" alt="perfil" class="profile-img">
    
    <h1 class="title">[ vitordev01 ]</h1>

    <div class="links">
       <!-- TIKTOK -->
      <a href="https://www.tiktok.com/@soldadodoceu2000" target="_blank" class="matrix-btn">
        <i class="fa-brands fa-tiktok"></i>
        Soldado do Céu
      </a>

      <!-- OSINT -->
      <a href="https://eye-of-g.netlify.app/" class="matrix-btn">
        <i class="fa-solid fa-eye"></i>
        Olho de Deus 
      </a>
       <!-- zap -->
      <a href="https://chat.whatsapp.com/DOTd682GQDz2qDv0HFDtNP" target="_blank" class="matrix-btn">
        <i class="fa-brands fa-whatsapp"></i>
        Geração Otaku 2018
      </a>
      
     <!-- YT-->
      <a href="https://www.youtube.com/@vitaumbr77" target="_blank" class="matrix-btn">
        <i class="fa-brands fa-youtube"></i>
        You Tube 
      </a>

  </div>

</body>
</html>
