  <style>
    body {
      background: #020b0a;
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      padding: 0;
      color: #00ff88;
      text-align: center;

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 400px;
    }

    /* FOTO PERFIL */
    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;

      border: 2px solid #00ff00;

      box-shadow:
        0 0 10px #00ff00,

    }

      font-size: 20px;

    }

    /* LINKS */
    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* BOTÃO MATRIX */
    .matrix-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      height: 50px;

      color: #00ff88;
      text-decoration: none;
      border-radius: 6px;

      border: 2px solid #00ff00;

      background: linear-gradient(
        90deg,
        rgba(0,255,100,0.2),
        rgba(0,255,100,0.05)
      );

      box-shadow:
        0 0 5px #00ff66,
        inset 0 0 5px #00ff00;

      transition: 0.3s;
    }

    .matrix-btn:hover {
      background: #00ff66;
      color: #001a0f;

      box-shadow:
        0 0 10px #00ff66,
        0 0 25px #00ff66,
        0 0 50px #00ff00;
    }
